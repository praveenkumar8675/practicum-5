<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Profile Cards</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
    }
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      height: 100vh;
    }
    .card {
      background: white;
      border: 2px solid #ccc;
      border-radius: 8px;
      padding: 20px;
      width: 180px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h3>Praveen</h3>
      <p>Major: Computer Science</p>
      <p>Year: Sophomore</p>
    </div>
    <div class="card">
      <h3>Praveen</h3>
      <p>Major: Mechanical Eng.</p>
      <p>Year: Junior</p>
    </div>
    <div class="card">
      <h3>Praveen</h3>
      <p>Major: Graphic Design</p>
      <p>Year: Senior</p>
    </div>
  </div>

</body>
</html>
